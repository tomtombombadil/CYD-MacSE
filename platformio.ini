; CYD Mac SE - PlatformIO project (ESP-IDF, no Arduino)
;
; Open this folder in VS Code with the PlatformIO extension, pick the env in
; the status bar, then Build / Upload. Nothing is downloaded but PlatformIO's
; own packages: Mini vMac's source is in components/minivmac.
;
; One env per board, named by screen size, display driver and touch type.

[platformio]
default_envs = fnk50_rgb_cap
src_dir = main

[env]
; pioarduino: community PlatformIO platform with ESP-IDF 5.5 (the same pin
; as cyd-classic-arcade)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Freenove 5.0" ESP32-S3 IPS display, 800x480 RGB, GT911 capacitive touch
; (FNK0115Q; also sold as Hosyond 5" ESP32-S3 800x480 - same board).
; Module ESP32-S3-WROOM-1 N16R8: 16 MB flash, 8 MB octal PSRAM.
[env:fnk50_rgb_cap]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
custom_firmware_name = CYD-MacSE_5.0in_RGB_Capacitive
custom_board_tested = no
custom_board_title = 5.0" RGB Capacitive (ESP32-S3, 800x480)
custom_board_hint = Freenove FNK0115Q or Hosyond 5" ESP32-S3 800x480: an ESP32-S3-WROOM-1 N16R8 module behind a 5" screen with capacitive touch.
custom_chip = esp32s3
